name: Android 监控 App

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "发布标签，用于 App 版本号"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6.0.2

      - name: 设置 JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 计算版本号
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
            CODE=1
          fi
          echo "APP_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      # Without these secrets the APK is signed with a throwaway debug key, so
      # each build installs fresh instead of upgrading the previous one.
      - name: 准备签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::未配置 ANDROID_KEYSTORE_BASE64，APK 使用调试签名"
          fi

      - name: 测试并构建 APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/1s-ui-monitor-android.apk"

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: s-ui-android
          path: 1s-ui-monitor-android.apk
          retention-days: 7
