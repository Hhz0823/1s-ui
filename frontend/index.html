<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script vite-ignore src="/.well-known/1s-ui/config.js"></script>
  <script>
    const configuredPath = (window.__SUI_CONFIG__ && window.__SUI_CONFIG__.basePath) || '/'
    const pathname = new URL(configuredPath || '/', window.location.origin).pathname
    const base = document.createElement('base')
    base.href = pathname === '/' ? '/' : `/${pathname.split('/').filter(Boolean).join('/')}/`
    document.head.appendChild(base)
  </script>
  <link rel="icon" href="./assets/favicon.ico" />
  <title>1S-UI</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
